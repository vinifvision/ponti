<section class="flex w-full max-w-[30rem] flex-col items-center">
  <app-auth-cabecalho voltarPara="/cadastro" />

  <h1 class="mt-12 text-center text-3xl font-semibold text-auth-marinho">Cadastro de mentor</h1>
  <p class="mt-2 text-center text-xl">Conte um pouco sobre a sua experiência</p>

  <form (ngSubmit)="criarConta()" class="mt-10 flex w-full flex-col gap-4" autocomplete="off" novalidate>
    <input name="nome" type="text" placeholder="Nome *" maxlength="255" [(ngModel)]="nome" class="w-full rounded-full border border-neutral-200 bg-neutral-200 px-8 py-4 text-lg text-gray-900 placeholder:text-neutral-400 focus:border-auth-lilas focus:outline-none focus:ring-2 focus:ring-auth-lilas/50" />
    <input name="areaAtuacao" type="text" placeholder="Área de atuação, ex.: Veterinário *" maxlength="255" [(ngModel)]="areaAtuacao" class="w-full rounded-full border border-neutral-200 bg-neutral-200 px-8 py-4 text-lg text-gray-900 placeholder:text-neutral-400 focus:border-auth-lilas focus:outline-none focus:ring-2 focus:ring-auth-lilas/50" />
    <input name="anosExperiencia" type="number" min="0" max="70" step="1" placeholder="Tempo de experiência (anos) *" [(ngModel)]="anosExperiencia" class="w-full rounded-full border border-neutral-200 bg-neutral-200 px-8 py-4 text-lg text-gray-900 placeholder:text-neutral-400 focus:border-auth-lilas focus:outline-none focus:ring-2 focus:ring-auth-lilas/50" />
    <textarea name="sobre" rows="4" placeholder="Sobre mim *" maxlength="2000" [(ngModel)]="sobre" class="w-full resize-none rounded-3xl border border-neutral-200 bg-neutral-200 px-8 py-4 text-lg text-gray-900 placeholder:text-neutral-400 focus:border-auth-lilas focus:outline-none focus:ring-2 focus:ring-auth-lilas/50"></textarea>
    <input name="email" type="email" placeholder="E-mail *" autocomplete="email" [(ngModel)]="email" class="w-full rounded-full border border-neutral-200 bg-neutral-200 px-8 py-4 text-lg text-gray-900 placeholder:text-neutral-400 focus:border-auth-lilas focus:outline-none focus:ring-2 focus:ring-auth-lilas/50" />
    <input name="senha" type="password" [placeholder]="'Senha (mínimo ' + senhaMinima + ' caracteres) *'" autocomplete="new-password" [(ngModel)]="senha" class="w-full rounded-full border border-neutral-200 bg-neutral-200 px-8 py-4 text-lg text-gray-900 placeholder:text-neutral-400 focus:border-auth-lilas focus:outline-none focus:ring-2 focus:ring-auth-lilas/50" />

    @if (erro()) {
      <p class="text-center text-sm text-red-600" role="alert">{{ erro() }}</p>
    }

    <button
      type="submit"
      [disabled]="salvando()"
      class="mt-4 w-full cursor-pointer rounded-full bg-auth-lilas py-5 text-xl font-medium text-white transition hover:brightness-95 disabled:cursor-default disabled:opacity-60 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-auth-marinho"
    >
      {{ salvando() ? 'Criando conta...' : 'Criar conta' }}
    </button>
  </form>
</section>
