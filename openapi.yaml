openapi: 3.0.3
info:
  title: Ponti API
  description: API do Ponti, plataforma que conecta startups em estágio inicial a mentores.
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Servidor local
tags:
  - name: Startups
  - name: Mentores
  - name: Convites
  - name: Auth
paths:
  /startups:
    get:
      tags: [Startups]
      summary: Lista startups
      responses:
        "200":
          description: Lista retornada com sucesso
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Startup"
    post:
      tags: [Startups]
      summary: Cria um(a) startup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Startup"
      responses:
        "201":
          description: Criado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Startup"
        "400":
          description: Dados inválidos
  /startups/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: [Startups]
      summary: Busca por id
      responses:
        "200":
          description: Encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Startup"
        "404":
          description: Não encontrado
    put:
      tags: [Startups]
      summary: Atualiza por id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Startup"
      responses:
        "200":
          description: Atualizado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Startup"
        "400":
          description: Dados inválidos
        "404":
          description: Não encontrado
    delete:
      tags: [Startups]
      summary: Remove por id
      responses:
        "204":
          description: Removido com sucesso
        "404":
          description: Não encontrado
  /mentores:
    get:
      tags: [Mentores]
      summary: Lista mentores
      responses:
        "200":
          description: Lista retornada com sucesso
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Mentor"
    post:
      tags: [Mentores]
      summary: Cria um(a) mentore
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Mentor"
      responses:
        "201":
          description: Criado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mentor"
        "400":
          description: Dados inválidos
  /mentores/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: [Mentores]
      summary: Busca por id
      responses:
        "200":
          description: Encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mentor"
        "404":
          description: Não encontrado
    put:
      tags: [Mentores]
      summary: Atualiza por id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Mentor"
      responses:
        "200":
          description: Atualizado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mentor"
        "400":
          description: Dados inválidos
        "404":
          description: Não encontrado
    delete:
      tags: [Mentores]
      summary: Remove por id
      responses:
        "204":
          description: Removido com sucesso
        "404":
          description: Não encontrado
  /convites:
    get:
      tags: [Convites]
      summary: Lista convites (com filtros opcionais)
      description: >
        Sem parâmetros, lista todos. Com `mentorId` devolve a inbox do mentor;
        com `startupId` devolve os convites enviados pela startup.
        `status` pode ser combinado com qualquer um dos dois.
      parameters:
        - name: mentorId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: startupId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [PENDENTE, ACEITO, RECUSADO]
      responses:
        "200":
          description: Lista retornada com sucesso
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Convite"
    post:
      tags: [Convites]
      summary: Envia um convite de uma startup para um mentor
      description: O convite sempre nasce com status PENDENTE.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Convite"
      responses:
        "201":
          description: Criado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Convite"
        "400":
          description: Dados inválidos
        "404":
          description: Startup ou mentor não encontrado
        "409":
          description: Essa startup já enviou um convite para esse mentor
  /convites/detalhados:
    get:
      tags: [Convites]
      summary: Lista convites já com os dados da startup e do mentor
      description: >
        Aceita os mesmos filtros de `GET /convites`. Use `mentorId` para montar a inbox do mentor
        e `startupId` para a lista de enviados da startup. O `site` da startup só vem preenchido
        quando o convite está ACEITO.
      parameters:
        - name: mentorId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: startupId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [PENDENTE, ACEITO, RECUSADO]
      responses:
        "200":
          description: Lista retornada com sucesso
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConviteDetalhe"
  /convites/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: [Convites]
      summary: Busca por id
      responses:
        "200":
          description: Encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Convite"
        "404":
          description: Não encontrado
    put:
      tags: [Convites]
      summary: Atualiza por id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Convite"
      responses:
        "200":
          description: Atualizado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Convite"
        "400":
          description: Dados inválidos
        "404":
          description: Não encontrado
    delete:
      tags: [Convites]
      summary: Remove por id
      responses:
        "204":
          description: Removido com sucesso
        "404":
          description: Não encontrado
  /convites/{id}/aceitar:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    post:
      tags: [Convites]
      summary: O mentor aceita o convite
      responses:
        "200":
          description: Convite aceito (status ACEITO)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Convite"
        "404":
          description: Não encontrado
        "409":
          description: O convite já foi respondido
  /convites/{id}/recusar:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    post:
      tags: [Convites]
      summary: O mentor recusa o convite
      responses:
        "200":
          description: Convite recusado (status RECUSADO)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Convite"
        "404":
          description: Não encontrado
        "409":
          description: O convite já foi respondido
  /mentores/{id}/certificacoes:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: [Mentores]
      summary: Lista as certificações do mentor (mais recentes primeiro)
      responses:
        "200":
          description: Lista retornada com sucesso
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Certificacao"
        "404":
          description: Mentor não encontrado
    post:
      tags: [Mentores]
      summary: Adiciona uma certificação ao perfil do mentor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Certificacao"
      responses:
        "201":
          description: Criada com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Certificacao"
        "400":
          description: Dados inválidos
        "404":
          description: Mentor não encontrado
  /mentores/{id}/certificacoes/{certificacaoId}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: certificacaoId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    delete:
      tags: [Mentores]
      summary: Remove uma certificação do perfil do mentor
      responses:
        "204":
          description: Removida com sucesso
        "404":
          description: Certificação não encontrada para esse mentor
  /auth/cadastro/startup:
    post:
      tags: [Auth]
      summary: Cadastra um usuário do tipo startup (credenciais + perfil da startup)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CadastroStartup"
      responses:
        "201":
          description: Usuário e startup criados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsuarioResumo"
        "400":
          description: Dados inválidos
        "409":
          description: Este e-mail já está cadastrado
  /auth/cadastro/mentor:
    post:
      tags: [Auth]
      summary: Cadastra um usuário do tipo mentor (credenciais + perfil do mentor)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CadastroMentor"
      responses:
        "201":
          description: Usuário e mentor criados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsuarioResumo"
        "400":
          description: Dados inválidos
        "409":
          description: Este e-mail já está cadastrado
  /auth/login:
    post:
      tags: [Auth]
      summary: Faz login com e-mail e senha e devolve um token JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredenciaisLogin"
      responses:
        "200":
          description: Login feito
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResposta"
        "400":
          description: E-mail ou senha em branco
        "401":
          description: E-mail ou senha inválidos (mesma resposta para os dois casos)
  /auth/me:
    get:
      tags: [Auth]
      summary: Devolve o usuário dono do token
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Usuário logado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsuarioResumo"
        "401":
          description: Token ausente, inválido ou expirado
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Startup:
      type: object
      required: [nome]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          example: 1
        nome:
          type: string
          example: AgroTech Recife
        descricao:
          type: string
          example: Plataforma de monitoramento de lavouras com sensores de baixo custo.
        videoPitchUrl:
          type: string
          format: uri
          example: https://www.youtube.com/watch?v=exemplo
        atuacoes:
          type: string
          example: Agricultura, IoT, sustentabilidade
        segmento:
          type: string
          example: Agritech
        cidade:
          type: string
          example: Recife
        estado:
          type: string
          example: PE
        site:
          type: string
          format: uri
          example: https://agrotechrecife.com.br
        estagioMaturidade:
          type: integer
          minimum: 1
          maximum: 9
          description: Escala de maturidade inspirada no TRL (1 a 9).
          example: 3
    Mentor:
      type: object
      required: [nome]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          example: 1
        nome:
          type: string
          example: Maria Souza
        bio:
          type: string
          example: Ex-fundadora com 10 anos de experiência em startups de tecnologia.
        areasAtuacao:
          type: string
          example: Produto, Validação de MVP, Captação
        ecossistemas:
          type: string
          example: Porto Digital, Cesar
        anosExperiencia:
          type: integer
          minimum: 0
          maximum: 70
          description: Tempo de experiência, em anos.
          example: 10
        valorSessao:
          type: number
          format: double
          description: Valor por sessão definido pelo mentor. 0 = mentoria gratuita.
          example: 150.00
        duracaoSessaoMinutos:
          type: integer
          minimum: 15
          maximum: 240
          description: Duração de cada sessão, em minutos.
          example: 60
        fotoUrl:
          type: string
          maxLength: 500
          nullable: true
        videoUrl:
          type: string
          maxLength: 500
          nullable: true
          description: Vídeo de apresentação (link do YouTube).
        linkedinUrl:
          type: string
          maxLength: 500
          nullable: true
        whatsapp:
          type: string
          maxLength: 30
          writeOnly: true
          description: >
            Só é gravado, nunca devolvido nas listagens. A startup recebe o WhatsApp em
            GET /convites/detalhados depois que o mentor aceita o convite.
    Certificacao:
      type: object
      required: [titulo]
      properties:
        id: { type: integer, format: int64, readOnly: true }
        mentorId: { type: integer, format: int64, readOnly: true, nullable: true }
        startupId: { type: integer, format: int64, readOnly: true, nullable: true }
        titulo: { type: string, maxLength: 255, example: Mentoria programa Sebrae }
        instituicao: { type: string, maxLength: 255, nullable: true, example: Sebrae }
        anoInicio: { type: integer, minimum: 1950, maximum: 2100, nullable: true, example: 2025 }
        anoFim:
          type: integer
          minimum: 1950
          maximum: 2100
          nullable: true
          description: Vazio = em andamento. Não pode ser anterior ao ano de início.
          example: 2026
        descricao: { type: string, maxLength: 1000, nullable: true }
    ConviteDetalhe:
      type: object
      properties:
        id:
          type: integer
          format: int64
        status:
          type: string
          enum: [PENDENTE, ACEITO, RECUSADO]
        startup:
          type: object
          nullable: true
          properties:
            id: { type: integer, format: int64 }
            nome: { type: string }
            descricao: { type: string }
            segmento: { type: string }
            cidade: { type: string }
            estado: { type: string }
            estagioMaturidade: { type: integer }
            videoPitchUrl: { type: string }
            site:
              type: string
              nullable: true
              description: Só preenchido quando o convite está ACEITO.
        mentor:
          type: object
          nullable: true
          properties:
            id: { type: integer, format: int64 }
            nome: { type: string }
            areasAtuacao: { type: string }
            ecossistemas: { type: string }
            valorSessao: { type: number }
            duracaoSessaoMinutos: { type: integer, nullable: true }
            fotoUrl: { type: string, nullable: true }
            linkedinUrl: { type: string, nullable: true }
            whatsapp:
              type: string
              nullable: true
              description: Só vem preenchido quando o convite está ACEITO.
    Convite:
      type: object
      required: [startupId, mentorId]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          example: 1
        startupId:
          type: integer
          format: int64
          example: 1
        mentorId:
          type: integer
          format: int64
          example: 1
        status:
          type: string
          enum: [PENDENTE, ACEITO, RECUSADO]
          default: PENDENTE
    CadastroStartup:
      type: object
      description: O nível de maturidade não entra no cadastro; é definido depois, em outro formulário.
      required: [nome, areaAtuacao, sobre, email, senha]
      properties:
        nome:
          type: string
          maxLength: 255
          example: AgroTech Recife
        areaAtuacao:
          type: string
          maxLength: 255
          description: Gravada no campo segmento da startup.
          example: Agritech
        sobre:
          type: string
          maxLength: 2000
          description: Texto "sobre mim". Gravado no campo descricao da startup.
          example: Plataforma de monitoramento de lavouras com sensores de baixo custo.
        email:
          type: string
          format: email
          example: contato@agrotechrecife.com.br
        senha:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          example: senhaSegura123
    CadastroMentor:
      type: object
      required: [nome, areaAtuacao, anosExperiencia, sobre, email, senha, valorSessao, duracaoSessaoMinutos]
      properties:
        nome:
          type: string
          maxLength: 255
          example: Maria Souza
        areaAtuacao:
          type: string
          maxLength: 255
          description: Gravada no campo areasAtuacao do mentor.
          example: Produto, Validação de MVP
        anosExperiencia:
          type: integer
          minimum: 0
          maximum: 70
          description: Tempo de experiência, em anos.
          example: 10
        sobre:
          type: string
          maxLength: 2000
          description: Texto "sobre mim". Gravado no campo bio do mentor.
          example: Ex-fundadora com 10 anos de experiência em startups de tecnologia.
        email:
          type: string
          format: email
          example: maria.souza@email.com
        senha:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          example: senhaSegura123
        ecossistemas: { type: string, maxLength: 255, example: "PetTech, Health-techs" }
        fotoUrl: { type: string, maxLength: 500 }
        videoUrl: { type: string, maxLength: 500, example: "https://www.youtube.com/watch?v=..." }
        linkedinUrl: { type: string, maxLength: 500 }
        whatsapp: { type: string, maxLength: 30, example: "+55 (81) 99999-0000" }
        certificacoes:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/Certificacao"
        valorSessao:
          type: number
          minimum: 0
          maximum: 100000
          description: Valor por sessão, com até 2 casas decimais. 0 = mentoria gratuita.
          example: 150.00
        duracaoSessaoMinutos:
          type: integer
          minimum: 15
          maximum: 240
          example: 60
    UsuarioResumo:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        email:
          type: string
          example: contato@agrotechrecife.com.br
        tipo:
          type: string
          enum: [STARTUP, MENTOR]
        startupId:
          type: integer
          format: int64
          nullable: true
          description: Preenchido quando tipo = STARTUP.
          example: 3
        mentorId:
          type: integer
          format: int64
          nullable: true
          description: Preenchido quando tipo = MENTOR.
          example: null
        nome:
          type: string
          nullable: true
          description: Nome da startup ou do mentor dono da conta.
          example: AgroTech Recife
    CredenciaisLogin:
      type: object
      required: [email, senha]
      properties:
        email:
          type: string
          example: petcare@exemplo.com
        senha:
          type: string
          format: password
          example: ponti1234
    LoginResposta:
      type: object
      properties:
        token:
          type: string
          description: 'Enviar nas próximas chamadas no cabeçalho "Authorization: Bearer <token>".'
          example: eyJhbGciOiJIUzM4NCJ9.eyJzdWIiOiIxIn0.assinatura
        tipoToken:
          type: string
          example: Bearer
        expiraEm:
          type: string
          format: date-time
          example: "2026-10-22T10:35:08Z"
        usuario:
          $ref: "#/components/schemas/UsuarioResumo"
