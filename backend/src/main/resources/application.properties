# ---- Banco padrão: H2 (em memória, não precisa instalar nada) ----
spring.datasource.url=jdbc:h2:mem:ponti
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# ---- Para usar PostgreSQL: comente as 3 linhas do H2 acima e descomente estas ----
#spring.datasource.url=jdbc:postgresql://localhost:5432/ponti
#spring.datasource.username=postgres
#spring.datasource.password=postgres

# Mostra a mensagem dos erros (ex.: "Startup não encontrada") para o front poder exibir
server.error.include-message=always

# ---- Login (JWT) ----
# Segredo usado para assinar os tokens (mínimo de 32 caracteres).
# O valor abaixo serve SÓ para desenvolvimento. Em produção, defina a variável de ambiente PONTI_JWT_SEGREDO.
ponti.jwt.segredo=${PONTI_JWT_SEGREDO:segredo-de-desenvolvimento-troque-em-producao-0123456789}
# Por quanto tempo o token vale (ex.: 8h, 30m, 1d)
ponti.jwt.expiracao=8h
