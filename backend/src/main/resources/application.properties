# ---- Banco padrão: H2 (em memória, não precisa instalar nada) ----
spring.datasource.url=jdbc:h2:mem:ponti
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# ---- Para usar PostgreSQL: comente as 3 linhas do H2 acima e descomente estas ----
#spring.datasource.url=jdbc:postgresql://localhost:5432/ponti
#spring.datasource.username=postgres
#spring.datasource.password=postgres

# Mensagens de validação em português (ex.: "não deve estar em branco")
spring.web.locale=pt_BR
spring.web.locale-resolver=fixed

# Origens que podem chamar a API (front local e GitHub Codespaces). Em produção, defina PONTI_CORS_ORIGENS.
ponti.cors.origens=${PONTI_CORS_ORIGENS:http://localhost:4200,https://*.app.github.dev}

# ---- Login (JWT) ----
# Segredo usado para assinar os tokens (mínimo de 32 caracteres).
# O valor abaixo serve SÓ para desenvolvimento. Em produção, defina a variável de ambiente PONTI_JWT_SEGREDO.
ponti.jwt.segredo=${PONTI_JWT_SEGREDO:segredo-de-desenvolvimento-troque-em-producao-0123456789}
# Por quanto tempo o token vale (ex.: 8h, 30m, 1d)
ponti.jwt.expiracao=8h

# ---- Demonstração ----
# Carrega mentores, startups e mentorias de exemplo (DadosDemonstracao). Use false para começar com poucos dados.
ponti.demo.completo=${PONTI_DEMO:true}
# Pagamento simulado: em quantos segundos o "banco" confirma o Pix, e por quantos minutos o Pix vale
ponti.pagamento.pix-aprovacao-segundos=6
ponti.pagamento.pix-validade-minutos=15

# ---- Ordenação de mentores (RankingPropriedades) ----
# Pesos da nota de ordenação. Precisam somar 1: se não somarem, a aplicação não sobe.
ponti.ranking.peso-match=0.45
ponti.ranking.peso-ocupacao=0.15
ponti.ranking.peso-reputacao=0.15
ponti.ranking.peso-confiabilidade=0.15
ponti.ranking.peso-perfil=0.05
ponti.ranking.peso-atividade=0.05
# Bônus de mentor novo: vale até bonus-novo e zera em dias-novo dias ou ao chegar a mentorias-novo mentorias
ponti.ranking.bonus-novo=0.10
ponti.ranking.dias-novo=30
ponti.ranking.mentorias-novo=3
# Janela (em dias) da ocupação e da regra "sem horário livre" (fim da lista)
ponti.ranking.janela-agenda-dias=14
# Dias sem acessar a plataforma para ir ao fim da lista
ponti.ranking.inativo-dias=30
# Janela da regra "recusou um pedido desta startup" (fim da lista só para ela)
ponti.ranking.recusa-dias=30
# Constante da média bayesiana da reputação
ponti.ranking.prior-avaliacoes=5
# Largura da faixa de desempate (notas a menos disso de distância entram na rotação diária)
ponti.ranking.faixa-desempate=0.02
