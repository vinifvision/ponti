# ---- Perfil de PRODUÇÃO (deploy no Render + banco no Supabase) ----
# Ativado com a variável de ambiente SPRING_PROFILES_ACTIVE=prod.
# Tudo que é segredo vem de variáveis de ambiente configuradas no Render, nunca escrito aqui.

# Porta: o Render informa a porta pela variável PORT
server.port=${PORT:8080}

# Banco PostgreSQL (Supabase, Session pooler)
spring.datasource.url=${PONTI_DB_URL}
spring.datasource.username=${PONTI_DB_USUARIO}
spring.datasource.password=${PONTI_DB_SENHA}
spring.datasource.driver-class-name=org.postgresql.Driver
# Plano gratuito do Supabase aceita poucas conexões: mantém o pool pequeno
spring.datasource.hikari.maximum-pool-size=5

# Cria/atualiza as tabelas a partir das entidades
spring.jpa.hibernate.ddl-auto=update

# Arquivos anexados: Supabase Storage, bucket privado "anexos".
# PONTI_SUPABASE_CHAVE é a chave secreta (service_role) do projeto: só no Render, nunca no código.
ponti.storage.tipo=supabase
ponti.storage.supabase.url=${PONTI_SUPABASE_URL}
ponti.storage.supabase.chave=${PONTI_SUPABASE_CHAVE}
ponti.storage.bucket=${PONTI_SUPABASE_BUCKET:anexos}

# Console do H2 desligado em produção
spring.h2.console.enabled=false
