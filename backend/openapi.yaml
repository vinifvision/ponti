openapi: 3.0.3
info:
  title: Ponti API
  description: |
    API do Ponti, plataforma que conecta startups em estágio inicial a mentores.

    **Autenticação:** faça login em `POST /auth/login` e envie o token em todas as outras
    rotas no cabeçalho `Authorization: Bearer <token>`. Só login e cadastro são públicos.

    **Permissões:** cada usuário só altera o que é dele. Sem token → 401; com token mas
    mexendo no perfil, agenda ou pedido de outra pessoa → 403.

    **Erros:** todas as respostas de erro seguem o padrão Problem Details (RFC 9457),
    em português, no schema `Erro`. Erros de validação trazem a lista `campos`.
  version: 1.1.0
servers:
  - url: http://localhost:8080
    description: Servidor local
security:
  - bearerAuth: []
tags:
  - name: Startups
  - name: Mentores
  - name: Convites
    description: >
      Sugestões de mentoria. O mentor sugere uma mentoria a uma startup (enviadoPor MENTOR);
      quando a startup agenda com esse mentor, a sugestão vira ACEITO sozinha.
  - name: Agenda
    description: >
      Fluxo de agendamento parecido com o do Preply: o mentor define os horários semanais,
      a startup escolhe um horário livre e paga (pagamento SIMULADO), e o mentor confirma
      com o link do Google Meet ou recusa.
  - name: Auth
  - name: Match
    description: Compatibilidade entre startups e mentores, calculada a partir dos temas e do setor.
  - name: Temas
    description: Assuntos usados no match entre startups e mentores.
paths:
  /temas:
    get:
      tags: [Temas]
      summary: Lista os temas disponíveis
      description: Lista pública (usada no cadastro, antes do login). É a mesma para startups e mentores.
      security: []
      responses:
        "200":
          description: Lista retornada com sucesso
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TemaOpcao"
  /mentores/recomendados:
    get:
      tags: [Match]
      summary: Mentores ordenados pela compatibilidade com a startup logada
      description: >
        Só para startups (mentor recebe 403). A compatibilidade vai de 0 a 100: 75 pontos pelos temas que o
        mentor cobre entre os que a startup precisa, mais 25 pelo setor (metade se o mentor atende todas as áreas).
        Cada item traz os motivos escritos.
      responses:
        "401": { $ref: "#/components/responses/SemLogin" }
        "403": { $ref: "#/components/responses/SemPermissao" }
        "200":
          description: Lista retornada com sucesso
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MentorRecomendado"
  /startups/recomendadas:
    get:
      tags: [Match]
      summary: Startups ordenadas pela compatibilidade com o mentor logado
      description: Só para mentores (startup recebe 403). Mesma regra de pontuação de /mentores/recomendados.
      responses:
        "401": { $ref: "#/components/responses/SemLogin" }
        "403": { $ref: "#/components/responses/SemPermissao" }
        "200":
          description: Lista retornada com sucesso
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StartupRecomendada"
  /startups:
    get:
      tags: [Startups]
      summary: Lista startups
      responses:
        "401": { $ref: "#/components/responses/SemLogin" }
        "403": { $ref: "#/components/responses/SemPermissao" }
        "200":
          description: Lista retornada com sucesso
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Startup"
  /startups/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: [Startups]
      summary: Busca por id
      responses:
        "401": { $ref: "#/components/responses/SemLogin" }
        "403": { $ref: "#/components/responses/SemPermissao" }
        "200":
          description: Encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Startup"
        "404":
          description: Não encontrado
    put:
      tags: [Startups]
      summary: Atualiza o perfil (só a própria startup)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Startup"
      responses:
        "401": { $ref: "#/components/responses/SemLogin" }
        "403": { $ref: "#/components/responses/SemPermissao" }
        "200":
          description: Atualizado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Startup"
        "400":
          description: Dados inválidos
        "404":
          description: Não encontrado
    patch:
      tags: [Startups]
      summary: Atualização parcial (só os campos enviados mudam; "" apaga um texto). Só a própria startup
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AtualizacaoStartup" }
      responses:
        "401": { $ref: "#/components/responses/SemLogin" }
        "403": { $ref: "#/components/responses/SemPermissao" }
        "200":
          description: Perfil atualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Startup" }
        "400": { description: Dados inválidos }
    delete:
      tags: [Startups]
      summary: Exclui a conta (perfil, login, convites e agendamentos). Só a própria startup
      responses:
        "401": { $ref: "#/components/responses/SemLogin" }
        "403": { $ref: "#/components/responses/SemPermissao" }
        "204":
          description: Removido com sucesso
        "404":
          description: Não encontrado
  /mentores:
    get:
      tags: [Mentores]
      summary: Lista mentores
      responses:
        "401": { $ref: "#/components/responses/SemLogin" }
        "403": { $ref: "#/components/responses/SemPermissao" }
        "200":
          description: Lista retornada com sucesso
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Mentor"
  /mentores/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: [Mentores]
      summary: Busca por id
      responses:
        "401": { $ref: "#/components/responses/SemLogin" }
        "403": { $ref: "#/components/responses/SemPermissao" }
        "200":
          description: Encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mentor"
        "404":
          description: Não encontrado
    put:
      tags: [Mentores]
      summary: Atualiza o perfil (só o próprio mentor)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Mentor"
      responses:
        "401": { $ref: "#/components/responses/SemLogin" }
        "403": { $ref: "#/components/responses/SemPermissao" }
        "200":
          description: Atualizado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mentor"
        "400":
          description: Dados inválidos
        "404":
          description: Não encontrado
    patch:
      tags: [Mentores]
      summary: Atualização parcial (só os campos enviados mudam; "" apaga um texto). Só o próprio mentor
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AtualizacaoMentor" }
      responses:
        "401": { $ref: "#/components/responses/SemLogin" }
        "403": { $ref: "#/components/responses/SemPermissao" }
        "200":
          description: Perfil atualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Mentor" }
        "400": { description: Dados inválidos }
    delete:
      tags: [Mentores]
      summary: Exclui a conta (perfil, login, agenda, convites e agendamentos). Só o próprio mentor
      responses:
        "401": { $ref: "#/components/responses/SemLogin" }
        "403": { $ref: "#/components/responses/SemPermissao" }
        "204":
          description: Removido com sucesso
        "404":
          description: Não encontrado
  /convites:
    get:
      tags: [Convites]
      summary: Lista convites (com filtros opcionais)
      description: >
        Sem parâmetros, lista todos. Com `mentorId` devolve a inbox do mentor;
        com `startupId` devolve os convites enviados pela startup.
        `status` pode ser combinado com qualquer um dos dois.
      parameters:
        - name: mentorId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: startupId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [PENDENTE, ACEITO, RECUSADO]
      responses:
        "401": { $ref: "#/components/responses/SemLogin" }
        "403": { $ref: "#/components/responses/SemPermissao" }
        "200":
          description: Lista retornada com sucesso
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Convite"
    post:
      tags: [Convites]
      summary: Envia um convite de uma startup para um mentor
      description: O convite sempre nasce com status PENDENTE.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Convite"
      responses:
        "401": { $ref: "#/components/responses/SemLogin" }
        "403": { $ref: "#/components/responses/SemPermissao" }
        "201":
          description: Criado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Convite"
        "400":
          description: Dados inválidos
        "404":
          description: Startup ou mentor não encontrado
        "409":
          description: Essa startup já enviou um convite para esse mentor
  /convites/detalhados:
    get:
      tags: [Convites]
      summary: Lista convites já com os dados da startup e do mentor
      description: >
        Aceita os mesmos filtros de `GET /convites`. Use `mentorId` para montar a inbox do mentor
        e `startupId` para a lista de enviados da startup. O `site` da startup só vem preenchido
        quando o convite está ACEITO.
      parameters:
        - name: mentorId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: startupId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [PENDENTE, ACEITO, RECUSADO]
      responses:
        "401": { $ref: "#/components/responses/SemLogin" }
        "403": { $ref: "#/components/responses/SemPermissao" }
        "200":
          description: Lista retornada com sucesso
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConviteDetalhe"
  /convites/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: [Convites]
      summary: Busca por id
      responses:
        "401": { $ref: "#/components/responses/SemLogin" }
        "403": { $ref: "#/components/responses/SemPermissao" }
        "200":
          description: Encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Convite"
        "404":
          description: Não encontrado
  /convites/{id}/aceitar:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    post:
      tags: [Convites]
      summary: O mentor aceita o convite
      responses:
        "401": { $ref: "#/components/responses/SemLogin" }
        "403": { $ref: "#/components/responses/SemPermissao" }
        "200":
          description: Convite aceito (status ACEITO)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Convite"
        "404":
          description: Não encontrado
        "409":
          description: O convite já foi respondido
  /convites/{id}/recusar:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    post:
      tags: [Convites]
      summary: O mentor recusa o convite
      responses:
        "401": { $ref: "#/components/responses/SemLogin" }
        "403": { $ref: "#/components/responses/SemPermissao" }
        "200":
          description: Convite recusado (status RECUSADO)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Convite"
        "404":
          description: Não encontrado
        "409":
          description: O convite já foi respondido
  /mentores/{id}/certificacoes:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: [Mentores]
      summary: Lista as certificações do mentor (mais recentes primeiro)
      responses:
        "401": { $ref: "#/components/responses/SemLogin" }
        "403": { $ref: "#/components/responses/SemPermissao" }
        "200":
          description: Lista retornada com sucesso
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Certificacao"
        "404":
          description: Mentor não encontrado
    post:
      tags: [Mentores]
      summary: Adiciona uma certificação ao perfil do mentor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Certificacao"
      responses:
        "401": { $ref: "#/components/responses/SemLogin" }
        "403": { $ref: "#/components/responses/SemPermissao" }
        "201":
          description: Criada com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Certificacao"
        "400":
          description: Dados inválidos
        "404":
          description: Mentor não encontrado
  /mentores/{id}/certificacoes/{certificacaoId}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: certificacaoId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    delete:
      tags: [Mentores]
      summary: Remove uma certificação do perfil do mentor
      responses:
        "401": { $ref: "#/components/responses/SemLogin" }
        "403": { $ref: "#/components/responses/SemPermissao" }
        "204":
          description: Removida com sucesso
        "404":
          description: Certificação não encontrada para esse mentor
  /startups/{id}/certificacoes:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: [Startups]
      summary: Lista as certificações da startup (mais recentes primeiro)
      responses:
        "401": { $ref: "#/components/responses/SemLogin" }
        "403": { $ref: "#/components/responses/SemPermissao" }
        "200":
          description: Lista retornada com sucesso
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Certificacao"
        "404":
          description: Startup não encontrada
    post:
      tags: [Startups]
      summary: Adiciona uma certificação ao perfil da startup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Certificacao"
      responses:
        "401": { $ref: "#/components/responses/SemLogin" }
        "403": { $ref: "#/components/responses/SemPermissao" }
        "201":
          description: Criada com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Certificacao"
        "400":
          description: Dados inválidos
        "404":
          description: Startup não encontrada
  /startups/{id}/certificacoes/{certificacaoId}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: certificacaoId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    delete:
      tags: [Startups]
      summary: Remove uma certificação do perfil da startup
      responses:
        "401": { $ref: "#/components/responses/SemLogin" }
        "403": { $ref: "#/components/responses/SemPermissao" }
        "204":
          description: Removida com sucesso
        "404":
          description: Certificação não encontrada para essa startup
  /mentores/{id}/disponibilidade:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Agenda]
      summary: Horários em que o mentor atende na semana
      responses:
        "401": { $ref: "#/components/responses/SemLogin" }
        "403": { $ref: "#/components/responses/SemPermissao" }
        "200":
          description: Faixas semanais, ordenadas de segunda a domingo
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FaixaDisponibilidade" }
        "404": { description: Mentor não encontrado }
    put:
      tags: [Agenda]
      summary: Substitui a disponibilidade semanal inteira do mentor
      description: Lista vazia = o mentor não atende. Faixas do mesmo dia não podem se sobrepor.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              maxItems: 50
              items: { $ref: "#/components/schemas/FaixaDisponibilidade" }
      responses:
        "401": { $ref: "#/components/responses/SemLogin" }
        "403": { $ref: "#/components/responses/SemPermissao" }
        "200":
          description: Disponibilidade salva
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FaixaDisponibilidade" }
        "400": { description: Faixa inválida ou sobreposta }
        "404": { description: Mentor não encontrado }
  /mentores/{id}/horarios:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Agenda]
      summary: Horários livres para agendar entre duas datas
      description: >
        Gerados a partir da disponibilidade semanal, em blocos do tamanho da sessão do mentor,
        sem os horários que já passaram ou estão ocupados. No máximo 62 dias por consulta.
      parameters:
        - { name: de, in: query, required: true, schema: { type: string, format: date, example: "2026-11-01" } }
        - { name: ate, in: query, required: true, schema: { type: string, format: date, example: "2026-11-30" } }
      responses:
        "401": { $ref: "#/components/responses/SemLogin" }
        "403": { $ref: "#/components/responses/SemPermissao" }
        "200":
          description: Início de cada horário livre (horário de Recife)
          content:
            application/json:
              schema:
                type: array
                items: { type: string, format: date-time, example: "2026-11-03T09:00:00" }
        "400": { description: Período inválido }
        "404": { description: Mentor não encontrado }
  /agendamentos:
    get:
      tags: [Agenda]
      summary: Mentorias de uma startup ou de um mentor
      parameters:
        - { name: startupId, in: query, required: false, schema: { type: integer, format: int64 } }
        - { name: mentorId, in: query, required: false, schema: { type: integer, format: int64 } }
      responses:
        "401": { $ref: "#/components/responses/SemLogin" }
        "403": { $ref: "#/components/responses/SemPermissao" }
        "200":
          description: Agendamentos em ordem de data
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Agendamento" }
        "400": { description: Informe startupId ou mentorId }
    post:
      tags: [Agenda]
      summary: A startup agenda um horário livre (pagamento simulado)
      description: >
        O preço e o fim da sessão vêm do perfil do mentor. O pagamento passa pelo gateway SIMULADO:
        PIX devolve o código copia e cola (BR Code) e fica AGUARDANDO até o "banco" confirmar (alguns segundos);
        CARTAO exige os dados do cartão e é aprovado ou recusado na hora (cartão de teste terminado em 0002 é recusado).
        Gratuita fica GRATUITA. O pedido nasce PENDENTE e só aparece para o mentor depois de pago.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NovoAgendamento" }
      responses:
        "401": { $ref: "#/components/responses/SemLogin" }
        "403": { $ref: "#/components/responses/SemPermissao" }
        "201":
          description: Pedido criado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agendamento" }
        "400": { description: Dados inválidos ou falta a forma de pagamento }
        "402": { description: Cartão recusado pelo banco emissor (nada é criado) }
        "422": { description: Número do cartão inválido ou cartão vencido }
        "404": { description: Startup ou mentor não encontrado }
        "409": { description: "Horário fora da disponibilidade, no passado ou já ocupado" }
  /agendamentos/{id}:
    get:
      tags: [Agenda]
      summary: Um agendamento (acompanhar o Pix e ver o comprovante). Só os participantes.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "401": { $ref: "#/components/responses/SemLogin" }
        "403": { $ref: "#/components/responses/SemPermissao" }
        "200":
          description: Agendamento
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agendamento" }
        "404": { description: Agendamento não encontrado }
  /agendamentos/{id}/avaliacao:
    post:
      tags: [Agenda]
      summary: A startup avalia a mentoria depois que ela aconteceu (nota 1 a 5 e comentário)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NovaAvaliacao" }
      responses:
        "401": { $ref: "#/components/responses/SemLogin" }
        "403": { $ref: "#/components/responses/SemPermissao" }
        "201":
          description: Avaliação registrada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agendamento" }
        "400": { description: Nota fora de 1 a 5 }
        "409": { description: A mentoria ainda não aconteceu ou já foi avaliada }
  /mentores/{id}/avaliacoes:
    get:
      tags: [Mentores]
      summary: Avaliações que o mentor recebeu, mais recentes primeiro
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "401": { $ref: "#/components/responses/SemLogin" }
        "403": { $ref: "#/components/responses/SemPermissao" }
        "200":
          description: Avaliações
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AvaliacaoPublica" }
        "404": { description: Mentor não encontrado }
  /agendamentos/{id}/confirmar:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      tags: [Agenda]
      summary: O mentor confirma o pedido e informa o link da reunião
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [linkReuniao]
              properties:
                linkReuniao: { type: string, maxLength: 500, pattern: "^https://\\S+$", example: "https://meet.google.com/abc-defg-hij" }
      responses:
        "401": { $ref: "#/components/responses/SemLogin" }
        "403": { $ref: "#/components/responses/SemPermissao" }
        "200":
          description: Confirmado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agendamento" }
        "400": { description: Link ausente ou que não começa com https:// }
        "404": { description: Agendamento não encontrado }
        "409": { description: Só pedidos pendentes podem ser confirmados }
  /agendamentos/{id}/recusar:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      tags: [Agenda]
      summary: O mentor recusa o pedido (pagamento vira REEMBOLSADO)
      responses:
        "401": { $ref: "#/components/responses/SemLogin" }
        "403": { $ref: "#/components/responses/SemPermissao" }
        "200":
          description: Recusado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agendamento" }
        "404": { description: Agendamento não encontrado }
        "409": { description: Só pedidos pendentes podem ser recusados }
  /agendamentos/{id}/cancelar:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      tags: [Agenda]
      summary: Cancela uma mentoria pendente ou confirmada que ainda não começou
      responses:
        "401": { $ref: "#/components/responses/SemLogin" }
        "403": { $ref: "#/components/responses/SemPermissao" }
        "200":
          description: Cancelado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agendamento" }
        "404": { description: Agendamento não encontrado }
        "409": { description: "Já começou, já aconteceu ou já foi recusado/cancelado" }
  /auth/cadastro/startup:
    post:
      tags: [Auth]
      summary: Cadastra um usuário do tipo startup (credenciais + perfil da startup)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CadastroStartup"
      responses:
        "201":
          description: Usuário e startup criados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsuarioResumo"
        "400":
          description: Dados inválidos
        "409":
          description: Este e-mail já está cadastrado
  /auth/cadastro/mentor:
    post:
      tags: [Auth]
      summary: Cadastra um usuário do tipo mentor (credenciais + perfil do mentor)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CadastroMentor"
      responses:
        "201":
          description: Usuário e mentor criados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsuarioResumo"
        "400":
          description: Dados inválidos
        "409":
          description: Este e-mail já está cadastrado
  /auth/login:
    post:
      tags: [Auth]
      summary: Faz login com e-mail e senha e devolve um token JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredenciaisLogin"
      responses:
        "200":
          description: Login feito
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResposta"
        "400":
          description: E-mail ou senha em branco
        "401":
          description: E-mail ou senha inválidos (mesma resposta para os dois casos)
  /auth/me:
    get:
      tags: [Auth]
      summary: Devolve o usuário dono do token
      security:
        - bearerAuth: []
      responses:
        "401": { $ref: "#/components/responses/SemLogin" }
        "403": { $ref: "#/components/responses/SemPermissao" }
        "200":
          description: Usuário logado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsuarioResumo"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    SemLogin:
      description: Token ausente, inválido ou expirado
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Erro" }
    SemPermissao:
      description: Logado, mas sem permissão para mexer neste recurso
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Erro" }
  schemas:
    MentorRecomendado:
      type: object
      properties:
        mentor: { $ref: "#/components/schemas/Mentor" }
        compatibilidade: { type: integer, minimum: 0, maximum: 100, example: 75 }
        motivos:
          type: array
          items: { type: string }
          example: ["Ajuda com Validação de ideia e Pitch e captação (2 de 3 temas que você precisa)", "Conhece o setor PetTech"]
    StartupRecomendada:
      type: object
      properties:
        startup: { $ref: "#/components/schemas/Startup" }
        compatibilidade: { type: integer, minimum: 0, maximum: 100, example: 100 }
        motivos:
          type: array
          items: { type: string }
    Tema:
      type: string
      description: Assunto em que uma startup precisa de ajuda ou em que um mentor ajuda.
      enum: [VALIDACAO, PRODUTO, TECNOLOGIA, PITCH, FINANCAS, VENDAS, MARKETING, JURIDICO, GESTAO]
      example: VALIDACAO
    TemaOpcao:
      type: object
      properties:
        codigo: { type: string, example: VALIDACAO }
        nome: { type: string, example: Validação de ideia }
    Erro:
      type: object
      description: Formato padrão de erro (Problem Details, RFC 9457) com textos em português.
      properties:
        type: { type: string, example: about:blank }
        title: { type: string, example: Dados inválidos }
        status: { type: integer, example: 400 }
        detail: { type: string, example: "email: deve ser um endereço de e-mail bem formado" }
        instance: { type: string, example: /auth/cadastro/mentor }
        message:
          type: string
          description: Mesmo texto de `detail`, pronto para mostrar ao usuário.
          example: "email: deve ser um endereço de e-mail bem formado"
        campos:
          type: array
          description: Só em erros de validação. Um item por campo inválido.
          items:
            type: object
            properties:
              campo: { type: string, example: email }
              mensagem: { type: string, example: deve ser um endereço de e-mail bem formado }
    Startup:
      type: object
      required: [nome]
      properties:
        necessidades:
          type: array
          maxItems: 3
          items: { $ref: "#/components/schemas/Tema" }
          description: "Temas em que a startup precisa de ajuda. Alimentam o match com os mentores."
        id:
          type: integer
          format: int64
          readOnly: true
          example: 1
        nome:
          type: string
          example: AgroTech Recife
        descricao:
          type: string
          example: Plataforma de monitoramento de lavouras com sensores de baixo custo.
        videoPitchUrl:
          type: string
          format: uri
          example: https://www.youtube.com/watch?v=exemplo
        fotoUrl:
          type: string
          maxLength: 500
          nullable: true
          description: Logo ou foto da startup.
        atuacoes:
          type: string
          example: Agricultura, IoT, sustentabilidade
        segmento:
          type: string
          example: Agritech
        cidade:
          type: string
          example: Recife
        estado:
          type: string
          example: PE
        site:
          type: string
          format: uri
          example: https://agrotechrecife.com.br
        estagioMaturidade:
          type: integer
          minimum: 1
          maximum: 9
          description: Escala de maturidade inspirada no TRL (1 a 9).
          example: 3
    Mentor:
      type: object
      required: [nome]
      properties:
        temas:
          type: array
          maxItems: 5
          items: { $ref: "#/components/schemas/Tema" }
          description: "Temas em que o mentor ajuda. Alimentam o match com as startups."
        id:
          type: integer
          format: int64
          readOnly: true
          example: 1
        nome:
          type: string
          example: Maria Souza
        bio:
          type: string
          example: Ex-fundadora com 10 anos de experiência em startups de tecnologia.
        areasAtuacao:
          type: string
          example: Produto, Validação de MVP, Captação
        ecossistemas:
          type: string
          example: Porto Digital, Cesar
        anosExperiencia:
          type: integer
          minimum: 0
          maximum: 70
          description: Tempo de experiência, em anos.
          example: 10
        valorSessao:
          type: number
          format: double
          description: Valor por sessão definido pelo mentor. 0 = mentoria gratuita.
          example: 150.00
        duracaoSessaoMinutos:
          type: integer
          minimum: 15
          maximum: 240
          description: Duração de cada sessão, em minutos.
          example: 60
        fotoUrl:
          type: string
          maxLength: 500
          nullable: true
        videoUrl:
          type: string
          maxLength: 500
          nullable: true
          description: Vídeo de apresentação (link do YouTube).
        linkedinUrl:
          type: string
          maxLength: 500
          nullable: true
        notaMedia: { type: number, nullable: true, readOnly: true, example: 4.7, description: Média das avaliações (1 casa decimal) }
        totalAvaliacoes: { type: integer, readOnly: true, example: 3 }
        totalMentorias: { type: integer, readOnly: true, example: 4, description: Mentorias já realizadas }
    AtualizacaoMentor:
      type: object
      description: Todos os campos são opcionais
      properties:
        temas:
          type: array
          maxItems: 5
          items: { $ref: "#/components/schemas/Tema" }
          description: "Lista vazia apaga; campo ausente mantém."
        nome: { type: string, minLength: 2, maxLength: 120 }
        bio: { type: string, maxLength: 2000 }
        areasAtuacao: { type: string }
        ecossistemas: { type: string }
        anosExperiencia: { type: integer, minimum: 0, maximum: 70 }
        valorSessao: { type: number, minimum: 0, maximum: 10000 }
        duracaoSessaoMinutos: { type: integer, minimum: 15, maximum: 240 }
        fotoUrl: { type: string, maxLength: 500 }
        videoUrl: { type: string, maxLength: 500 }
        linkedinUrl: { type: string, maxLength: 500 }
    AtualizacaoStartup:
      type: object
      description: Todos os campos são opcionais
      properties:
        necessidades:
          type: array
          maxItems: 3
          items: { $ref: "#/components/schemas/Tema" }
          description: "Lista vazia apaga; campo ausente mantém."
        nome: { type: string, minLength: 2, maxLength: 120 }
        descricao: { type: string, maxLength: 2000 }
        videoPitchUrl: { type: string, maxLength: 500 }
        fotoUrl: { type: string, maxLength: 500 }
        atuacoes: { type: string }
        segmento: { type: string }
        cidade: { type: string }
        estado: { type: string, maxLength: 2 }
        site: { type: string, maxLength: 500 }
        estagioMaturidade: { type: integer, minimum: 1, maximum: 9 }
    Certificacao:
      type: object
      required: [titulo]
      properties:
        id: { type: integer, format: int64, readOnly: true }
        mentorId: { type: integer, format: int64, readOnly: true, nullable: true }
        startupId: { type: integer, format: int64, readOnly: true, nullable: true }
        titulo: { type: string, maxLength: 255, example: Mentoria programa Sebrae }
        instituicao: { type: string, maxLength: 255, nullable: true, example: Sebrae }
        anoInicio: { type: integer, minimum: 1950, maximum: 2100, nullable: true, example: 2025 }
        anoFim:
          type: integer
          minimum: 1950
          maximum: 2100
          nullable: true
          description: Vazio = em andamento. Não pode ser anterior ao ano de início.
          example: 2026
        descricao: { type: string, maxLength: 1000, nullable: true }
    ConviteDetalhe:
      type: object
      properties:
        id:
          type: integer
          format: int64
        status:
          type: string
          enum: [PENDENTE, ACEITO, RECUSADO]
        enviadoPor:
          type: string
          enum: [STARTUP, MENTOR]
        startup:
          type: object
          nullable: true
          properties:
            id: { type: integer, format: int64 }
            nome: { type: string }
            descricao: { type: string }
            segmento: { type: string }
            cidade: { type: string }
            estado: { type: string }
            estagioMaturidade: { type: integer }
            videoPitchUrl: { type: string }
            fotoUrl: { type: string, nullable: true }
            site:
              type: string
              nullable: true
              description: Só preenchido quando o convite está ACEITO.
        mentor:
          type: object
          nullable: true
          properties:
            id: { type: integer, format: int64 }
            nome: { type: string }
            areasAtuacao: { type: string }
            ecossistemas: { type: string }
            valorSessao: { type: number }
            duracaoSessaoMinutos: { type: integer, nullable: true }
            fotoUrl: { type: string, nullable: true }
            linkedinUrl: { type: string, nullable: true }
    FaixaDisponibilidade:
      type: object
      required: [diaSemana, horaInicio, horaFim]
      properties:
        diaSemana: { type: string, enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY] }
        horaInicio: { type: string, example: "09:00" }
        horaFim: { type: string, example: "12:00", description: Precisa ser depois de horaInicio }
    NovoAgendamento:
      type: object
      required: [startupId, mentorId, inicio]
      properties:
        startupId: { type: integer, format: int64 }
        mentorId: { type: integer, format: int64 }
        inicio: { type: string, format: date-time, example: "2026-11-03T09:00:00" }
        metodoPagamento: { type: string, enum: [PIX, CARTAO], description: Obrigatório se a mentoria for paga }
        cartao: { $ref: "#/components/schemas/DadosCartao" }
        mensagem: { type: string, maxLength: 1000, description: O que a startup quer tratar na sessão }
    DadosCartao:
      type: object
      description: Obrigatório com CARTAO. Só passa pelo gateway simulado; a API guarda apenas a bandeira e os 4 últimos dígitos.
      required: [numero, nomeImpresso, validade, cvv]
      properties:
        numero: { type: string, example: "4242 4242 4242 4242" }
        nomeImpresso: { type: string, example: MARIA DA SILVA }
        validade: { type: string, pattern: "^(0[1-9]|1[0-2])/\\d{2}$", example: "12/30" }
        cvv: { type: string, example: "123" }
    NovaAvaliacao:
      type: object
      required: [nota]
      properties:
        nota: { type: integer, minimum: 1, maximum: 5 }
        comentario: { type: string, maxLength: 1000 }
    AvaliacaoPublica:
      type: object
      properties:
        id: { type: integer, format: int64 }
        nota: { type: integer }
        comentario: { type: string, nullable: true }
        startupNome: { type: string }
        startupFotoUrl: { type: string, nullable: true }
        criadoEm: { type: string, format: date-time }
    Agendamento:
      type: object
      properties:
        id: { type: integer, format: int64 }
        inicio: { type: string, format: date-time }
        fim: { type: string, format: date-time }
        valor: { type: number, description: Preço do mentor no momento do agendamento }
        status: { type: string, enum: [PENDENTE, CONFIRMADO, RECUSADO, CANCELADO] }
        statusPagamento: { type: string, enum: [GRATUITA, AGUARDANDO, PAGO, REEMBOLSADO, EXPIRADO], description: Pagamento simulado }
        metodoPagamento: { type: string, enum: [PIX, CARTAO], nullable: true }
        linkReuniao: { type: string, nullable: true, description: Só vem quando CONFIRMADO }
        mensagem: { type: string, nullable: true }
        startup: { $ref: "#/components/schemas/ParteAgendamento" }
        mentor: { $ref: "#/components/schemas/ParteAgendamento" }
        realizada: { type: boolean, description: Confirmada e com o horário já encerrado (pode ser avaliada) }
        pagamento:
          type: object
          nullable: true
          description: Dados do comprovante
          properties:
            codigoTransacao: { type: string, example: PNT-7K2M9QX4 }
            pixCopiaECola: { type: string, nullable: true, description: Só enquanto o Pix está AGUARDANDO }
            expiraEm: { type: string, format: date-time, nullable: true }
            pagoEm: { type: string, format: date-time, nullable: true }
            cartaoFinal: { type: string, nullable: true, example: "4242" }
            cartaoBandeira: { type: string, nullable: true, example: Visa }
        avaliacao:
          type: object
          nullable: true
          properties:
            nota: { type: integer }
            comentario: { type: string, nullable: true }
    ParteAgendamento:
      type: object
      nullable: true
      properties:
        id: { type: integer, format: int64 }
        nome: { type: string }
        fotoUrl: { type: string, nullable: true }
        descricao: { type: string, nullable: true, description: Segmento da startup ou área do mentor }
    Convite:
      type: object
      required: [startupId, mentorId]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          example: 1
        startupId:
          type: integer
          format: int64
          example: 1
        mentorId:
          type: integer
          format: int64
          example: 1
        status:
          type: string
          enum: [PENDENTE, ACEITO, RECUSADO]
          default: PENDENTE
        enviadoPor:
          type: string
          enum: [STARTUP, MENTOR]
          default: STARTUP
          description: >
            Quem tomou a iniciativa. Quem responde (aceita ou recusa) é o outro lado.
            Só existe um convite por par startup + mentor, seja qual for o sentido.
    CadastroStartup:
      type: object
      description: O nível de maturidade não entra no cadastro; é definido depois, em outro formulário.
      required: [nome, areaAtuacao, sobre, email, senha]
      properties:
        necessidades:
          type: array
          maxItems: 3
          items: { $ref: "#/components/schemas/Tema" }
          description: "Temas em que a startup precisa de ajuda (escolha de 1 a 3 na tela de cadastro)."
        nome:
          type: string
          maxLength: 255
          example: AgroTech Recife
        areaAtuacao:
          type: string
          maxLength: 255
          description: Gravada no campo segmento da startup.
          example: Agritech
        sobre:
          type: string
          maxLength: 2000
          description: Texto "sobre mim". Gravado no campo descricao da startup.
          example: Plataforma de monitoramento de lavouras com sensores de baixo custo.
        email:
          type: string
          format: email
          example: contato@agrotechrecife.com.br
        senha:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          example: senhaSegura123
        cidade: { type: string, maxLength: 255, example: Recife }
        estado: { type: string, maxLength: 2, example: PE }
        videoPitchUrl: { type: string, maxLength: 500, example: "https://www.youtube.com/watch?v=..." }
        fotoUrl: { type: string, maxLength: 500 }
        site: { type: string, maxLength: 500 }
    CadastroMentor:
      type: object
      required: [nome, areaAtuacao, anosExperiencia, sobre, email, senha, valorSessao, duracaoSessaoMinutos]
      properties:
        temas:
          type: array
          maxItems: 5
          items: { $ref: "#/components/schemas/Tema" }
          description: "Temas em que o mentor ajuda (escolha de 1 a 5 na tela de cadastro)."
        nome:
          type: string
          maxLength: 255
          example: Maria Souza
        areaAtuacao:
          type: string
          maxLength: 255
          description: Gravada no campo areasAtuacao do mentor.
          example: Produto, Validação de MVP
        anosExperiencia:
          type: integer
          minimum: 0
          maximum: 70
          description: Tempo de experiência, em anos.
          example: 10
        sobre:
          type: string
          maxLength: 2000
          description: Texto "sobre mim". Gravado no campo bio do mentor.
          example: Ex-fundadora com 10 anos de experiência em startups de tecnologia.
        email:
          type: string
          format: email
          example: maria.souza@email.com
        senha:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          example: senhaSegura123
        ecossistemas: { type: string, maxLength: 255, example: "PetTech, Health-techs" }
        fotoUrl: { type: string, maxLength: 500 }
        videoUrl: { type: string, maxLength: 500, example: "https://www.youtube.com/watch?v=..." }
        linkedinUrl: { type: string, maxLength: 500 }
        certificacoes:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/Certificacao"
        valorSessao:
          type: number
          minimum: 0
          maximum: 100000
          description: Valor por sessão, com até 2 casas decimais. 0 = mentoria gratuita.
          example: 150.00
        duracaoSessaoMinutos:
          type: integer
          minimum: 15
          maximum: 240
          example: 60
    UsuarioResumo:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        email:
          type: string
          example: contato@agrotechrecife.com.br
        tipo:
          type: string
          enum: [STARTUP, MENTOR]
        startupId:
          type: integer
          format: int64
          nullable: true
          description: Preenchido quando tipo = STARTUP.
          example: 3
        mentorId:
          type: integer
          format: int64
          nullable: true
          description: Preenchido quando tipo = MENTOR.
          example: null
        nome:
          type: string
          nullable: true
          description: Nome da startup ou do mentor dono da conta.
          example: AgroTech Recife
    CredenciaisLogin:
      type: object
      required: [email, senha]
      properties:
        email:
          type: string
          example: petcare@exemplo.com
        senha:
          type: string
          format: password
          example: ponti1234
    LoginResposta:
      type: object
      properties:
        token:
          type: string
          description: 'Enviar nas próximas chamadas no cabeçalho "Authorization: Bearer <token>".'
          example: eyJhbGciOiJIUzM4NCJ9.eyJzdWIiOiIxIn0.assinatura
        tipoToken:
          type: string
          example: Bearer
        expiraEm:
          type: string
          format: date-time
          example: "2026-10-22T10:35:08Z"
        usuario:
          $ref: "#/components/schemas/UsuarioResumo"
